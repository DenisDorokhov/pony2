plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.dorokhov.pony2'
version = '2.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    runtimeOnly 'com.h2database:h2'

    implementation project(':frontend')

    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
    implementation 'org.springframework.ai:spring-ai-openai'

    implementation 'org.hibernate.search:hibernate-search-mapper-orm:8.4.0.Final'
    implementation 'org.hibernate.search:hibernate-search-backend-lucene:8.4.0.Final'
    implementation 'org.apache.tika:tika-core:4.0.0'
    implementation 'net.coobird:thumbnailator:0.4.21'
    implementation 'net.jthink:jaudiotagger:3.0.1'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'com.auth0:java-jwt:4.6.1'
    implementation 'org.zalando:logbook-spring-boot-starter:4.2.0'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.2'
    implementation 'com.github.spotbugs:spotbugs-annotations:4.10.4'
    implementation 'com.google.guava:guava:33.7.1-jre'

    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.assertj:assertj-core'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    archiveBaseName = rootProject.name
}
bootJar {
    archiveBaseName = rootProject.name
}

springBoot {
    buildInfo()
}

tasks.named('test') {
    useJUnitPlatform()
}
