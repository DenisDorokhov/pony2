#
# Squid listens only inside Docker because we do not publish port 3128.
#
http_port 3128


#
# Only normal web traffic.
#
acl Safe_ports port 80
acl Safe_ports port 443

acl SSL_ports port 443
acl CONNECT method CONNECT


#
# -------- BLOCK PRIVATE / LOCAL IPv4 --------
#

# "This network"
acl blocked_dst dst 0.0.0.0/8

# RFC1918
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.168.0.0/16

# Loopback
acl blocked_dst dst 127.0.0.0/8

# Carrier-grade NAT
acl blocked_dst dst 100.64.0.0/10

# Link-local / metadata
acl blocked_dst dst 169.254.0.0/16

# Benchmark networks
acl blocked_dst dst 198.18.0.0/15

# Multicast
acl blocked_dst dst 224.0.0.0/4

# Reserved
acl blocked_dst dst 240.0.0.0/4


#
# -------- BLOCK PRIVATE / LOCAL IPv6 --------
#

acl blocked6_dst dst ::/128
acl blocked6_dst dst ::1/128

# Unique local addresses
acl blocked6_dst dst fc00::/7

# Link-local
acl blocked6_dst dst fe80::/10


#
# Local-looking DNS names.
#
acl blocked_name dstdomain localhost
acl blocked_name dstdomain .localhost
acl blocked_name dstdomain .local
acl blocked_name dstdomain .lan
acl blocked_name dstdomain .home.arpa


#
# -------- ACCESS POLICY --------
#

# No weird destination ports.
http_access deny !Safe_ports

# CONNECT only for HTTPS.
http_access deny CONNECT !SSL_ports

# Block internal/private destinations.
http_access deny blocked_dst
http_access deny blocked6_dst
http_access deny blocked_name

# Squid built-ins.
http_access deny to_localhost
http_access deny to_linklocal


#
# Allow everything else.
#
http_access allow all

# Explicit final catch-all.
http_access deny all


#
# We don't need caching.
#
cache deny all


#
# Privacy.
#
forwarded_for delete
via off
